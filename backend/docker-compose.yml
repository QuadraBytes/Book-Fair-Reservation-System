version: '3.8'

services:

  mysql8:
    image: mysql:8.0
    container_name: mysql8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "@123"
      MYSQL_DATABASE: QuadraBytes
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql8-data:/var/lib/mysql
    networks:
      - backend-network

  user-service:
    build: ./Users
    container_name: quadra-bytes-user-service
    depends_on:
      - mysql8
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql8:3306/QuadraBytes
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@123"
    ports:
      - "9081:9081"
    networks:
      - backend-network

  reservation-service:
    build: ./Reservation
    container_name: quadra-bytes-reservation-service
    depends_on:
      - mysql8
      - kafka
      - schema-registry
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql8:3306/QuadraBytes
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@123"
    ports:
      - "9082:9082"
    networks:
      - backend-network
    volumes:
      - ./uploads/qr:/app/uploads/qr

  notification-service:
    build: ./Notifications
    container_name: quadra-bytes-notification-service
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "9083:9083"
    networks:
      - backend-network

  api-gateway:
    build: ./api-gateway
    container_name: quadra-bytes-api-gateway
    depends_on:
      - user-service
      - reservation-service
      - notification-service
    ports:
      - "9080:9080"
    networks:
      - backend-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: quadra-bytes-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - backend-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quadra-bytes-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: quadra-bytes-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: quadra-bytes-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
